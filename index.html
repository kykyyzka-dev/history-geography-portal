<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Історія та Географія — Освітній портал Сергія Мовчана</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Глобальні стилі */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    a {
      text-decoration: none;
      color: inherit;
    }

    /* Навігаційне меню */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0) 100%);
    }
    .logo {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .logo span {
      color: #3b82f6;
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: 30px;
    }
    nav a {
      font-weight: 500;
      font-size: 1rem;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #60a5fa;
    }

    /* Головний банер (Hero Section) */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 100px 8% 60px 8%;
      /* Підключення вашого банера hero-banner.jpeg */
      background: url('hero-banner.jpeg') center/cover no-repeat;
    }

    /* Накладення затемнення для високої читабельності тексту */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg, 
        rgba(15, 23, 42, 0.85) 0%, 
        rgba(15, 23, 42, 0.65) 50%, 
        rgba(15, 23, 42, 0.2) 100%
      );
      z-index: 1;
    }

    /* Контент банера */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
    }
    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }
    .hero-title .highlight {
      color: #f59e0b;
      display: block;
    }
    .hero-subtitle {
      font-size: 1.25rem;
      margin-bottom: 35px;
      color: #e2e8f0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      font-weight: 300;
    }

    /* Кнопки заклику до дії */
    .hero-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .btn {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 16px 32px;
      border-radius: 12px;
      transition: all 0.3s ease;
      display: inline-block;
      text-align: center;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.6);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* Адаптивність для мобільних пристроїв */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 15px;
        padding: 15px;
      }
      .hero {
        padding-top: 130px;
        text-align: center;
        justify-content: center;
      }
      .hero-overlay {
        background: rgba(15, 23, 42, 0.75);
      }
      .hero-title {
        font-size: 2.2rem;
      }
      .hero-subtitle {
        font-size: 1.05rem;
      }
      .hero-buttons {
        justify-content: center;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Навігація -->
  <header>
    <div class="logo">СЕРГІЙ <span>МОВЧАН</span></div>
    <nav>
      <ul>
        <li><a href="#about">Про автора</a></li>
        <li><a href="#subjects">Предмети</a></li>
        <li><a href="#materials">Матеріали</a></li>
        <li><a href="#contact">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <!-- Головний банер (Hero Section) -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">
        Історія та Географія
        <span class="highlight">без меж</span>
      </h1>
      <p class="hero-subtitle">
        Авторський освітній портал Сергія Мовчана.
        Відкривайте таємниці минулого та досліджуйте дивовижний світ навколо нас!
      </p>
      <div class="hero-buttons">
        <a href="#subjects" class="btn btn-primary">Обрати предмет</a>
        <a href="#materials" class="btn btn-secondary">Віртуальні матеріали</a>
      </div>
    </div>
  </section>

</body>
</html>
